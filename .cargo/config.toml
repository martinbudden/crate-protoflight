[build]
# Automatically compile for the RP2350 core when running generic 'cargo build'
#target = "thumbv8m.main-none-eabihf"


# -----------------------------------------------------------------------------
# Configuration for Cortex-M4F / Cortex-M7F (Single-Precision FPUs)
# Devices like: STM32F4, STM32F7 (SP variants), NXP Kinetis K64
# -----------------------------------------------------------------------------
[target.thumbv7em-none-eabihf]
rustflags = [
    "-C", "target-cpu=cortex-m4",
    "-C", "llvm-args=--inline-threshold=250",
]

# -----------------------------------------------------------------------------
# Configuration for Cortex-M33 (Modern Armv8-M with FPU)
# Devices like: Nordic nRF5340, STM32U5, LPC55S69, RP2350
# -----------------------------------------------------------------------------
[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "target-cpu=cortex-m33",
    "-C", "llvm-args=--inline-threshold=250",
    "-C", "no-vectorize-loops",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

# Note for ESP32:
# cargo install espup
# espup install
# is required

# -----------------------------------------------------------------------------
# Target Configuration for ESP32-S3 (Bare-Metal / no_std)
# -----------------------------------------------------------------------------
[target.xtensa-esp32s3-none-elf]
rustflags = [
    "-C", "llvm-args=--inline-threshold=250",
  # The S3 processor doesn't use ARM target-cpu names; it uses Xtensa scheduling.
  # The target architecture handles this automatically.
]

# -----------------------------------------------------------------------------
# Target Configuration for ESP32-S3 (With ESP-IDF Framework)
# -----------------------------------------------------------------------------
[target.xtensa-esp32s3-espidf]
rustflags = [
    "-C", "llvm-args=--inline-threshold=250",
]

[alias]
# Run using: 'cargo test-host'
test-host = "test --no-default-features --features std,libm,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug --target x86_64-unknown-linux-gnu"
check-host = "check --no-default-features --features std,libm,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug --target x86_64-unknown-linux-gnu"

# Shortcut to build specifically for the Double-Precision Cortex-M7
# Devices like: STM32H7, NXP i.MX RT1060
build-m7 = [
    "build", 
    "--target", "thumbv7em-none-eabihf", 
    "--config", "target.thumbv7em-none-eabihf.rustflags=['-C', 'target-cpu=cortex-m7', '-C', 'inline-threshold=300']"
]

# Shortcut to run or flash specifically on the Cortex-M7
run-m7 = [
    "run", 
    "--target", "thumbv7em-none-eabihf", 
    "--config", "target.thumbv7em-none-eabihf.rustflags=['-C', 'target-cpu=cortex-m7', '-C', 'inline-threshold=300']"
]

test-rp2350 = [
    "test",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    #"libm,rp2350,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug"
    "libm,rp2350"
]

check-rp2350 = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "libm,rpi_pico2,autopilot,barometer,magnetometer,msp,osd,rangefinder,rpm_filters"
    #"rp2350,libm,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug"
]

check-rp2350-m = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "libm,madflight_fc3,autopilot,barometer,magnetometer,osd,rangefinder",
    #"rp2350,libm,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug"
]

build-rp2350 = [
    "build",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features", "libm,rp2350,battery"
]

run-rp2350 = [
    "run",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "libm,rp2350,autopilot,barometer,battery,blackbox,gps,msp,osd,rpm_filters,rtt-debug"
]


check-stm32f405 = [
    "check",
    "--target", "thumbv7em-none-eabihf",
    "--no-default-features",
    "--features", "libm,stm32,stm32f405,speedybee_f405_v4,autopilot,barometer,magnetometer,osd,rangefinder"
]

check-stm32f405-m = [
    "check",
    "--target", "thumbv7em-none-eabihf",
    "--no-default-features",
    "--features", "libm,stm32,stm32f405,matek_f405_wte"
]

check-stm32f405-s = [
    "check",
    "--target", "thumbv7em-none-eabihf",
    "--no-default-features",
    "--features", "libm,stm32,stm32f405,sp_racing_f4_evo"
]

build-stm32f405 = [
    "build",
    "--target", "thumbv7em-none-eabihf",
    "--no-default-features",
    "--features", "libm,stm32,stm32f405,speedybee_f405_v4"
]
